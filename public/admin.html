<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetaLinkNFT Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/MetaLink-NFT-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    body { background: #f5f7fa; color: #333; }
    .admin-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1a1a2e, #16213e); }
    .admin-login-card { background: #fff; border-radius: 16px; padding: 40px; width: 90%; max-width: 380px; text-align: center; }
    .admin-login-card h2 { font-size: 1.3rem; margin-bottom: 8px; color: #1a1a2e; }
    .admin-login-card p { font-size: 0.85rem; color: #888; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div id="adminApp"></div>
  <script>
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function toDatetimeLocal(isoString) {
      const d = new Date(isoString);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    const Admin = {
      token: localStorage.getItem('mlk_admin_token'),
      currentPage: 'dashboard',

      async api(endpoint, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (this.token) headers['Authorization'] = 'Bearer ' + this.token;
        const res = await fetch('/api' + endpoint, { ...options, headers });
        const data = await res.json();
        if (res.status === 401 || res.status === 403) {
          this.logout();
          throw new Error('Session expired. Please log in again.');
        }
        if (!res.ok) throw new Error(data.error || 'Error');
        return data;
      },

      toast(msg, type = 'error') {
        const el = document.createElement('div');
        el.className = `toast toast-${type}`;
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
      },

      init() {
        if (!this.token) this.renderLogin();
        else this.renderDashboard();
      },

      renderLogin() {
        document.getElementById('adminApp').innerHTML = `
          <div class="admin-login">
            <div class="admin-login-card">
              <h2>Admin Panel</h2>
              <p>MetaLinkNFT Management</p>
              <form id="adminLoginForm">
                <div class="admin-form-group">
                  <input type="text" class="admin-form-input" id="adminUser" placeholder="Username" value="admin" required>
                </div>
                <div class="admin-form-group">
                  <input type="password" class="admin-form-input" id="adminPass" placeholder="Password" required>
                </div>
                <button type="submit" class="admin-btn admin-btn-primary" style="width:100%;padding:14px;font-size:1rem;margin-top:8px;">Sign In</button>
              </form>
            </div>
          </div>`;
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          try {
            const data = await this.api('/admin/login', {
              method: 'POST',
              body: JSON.stringify({ username: document.getElementById('adminUser').value, password: document.getElementById('adminPass').value })
            });
            this.token = data.token;
            localStorage.setItem('mlk_admin_token', data.token);
            this.renderDashboard();
          } catch (e) { this.toast(e.message); }
        });
      },

      async renderDashboard() {
        const app = document.getElementById('adminApp');
        app.innerHTML = `
          <div class="admin-layout">
            <div class="admin-sidebar-overlay" id="adminSidebarOverlay"></div>
            <aside class="admin-sidebar" id="adminSidebar">
              <div class="admin-sidebar-logo">
                <h2>MetaLinkNFT</h2>
                <span>Admin Dashboard</span>
              </div>
              <button class="admin-nav-item active" data-page="dashboard">&#128202; Dashboard</button>
              <button class="admin-nav-item" data-page="users">&#128101; Users</button>
              <button class="admin-nav-item" data-page="multiaccounts">&#128737; Multi-Accounts</button>
              <button class="admin-nav-item" data-page="withdrawals">&#128181; Withdrawals</button>
              <button class="admin-nav-item" data-page="deposits">&#128179; Deposits</button>
              <button class="admin-nav-item" data-page="reservations">&#127915; Reservations</button>
              <button class="admin-nav-item" data-page="wallets">&#128092; Wallets</button>
              <button class="admin-nav-item" data-page="announcements">&#128227; Announcements</button>
              <button class="admin-nav-item" data-page="settings">&#9881; Settings</button>
              <button class="admin-nav-item" style="margin-top:auto;" onclick="Admin.logout()">&#128682; Logout</button>
            </aside>
            <div class="admin-main">
              <header class="admin-header">
                <div style="display:flex;align-items:center;gap:12px;">
                  <button class="admin-hamburger-btn" id="adminHamburgerBtn" aria-label="Toggle menu">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                  </button>
                  <h2 id="adminPageTitle">Dashboard</h2>
                </div>
                <div class="admin-header-actions">
                  <span style="font-size:0.85rem;color:#888;">Admin</span>
                </div>
              </header>
              <div class="admin-content" id="adminContent"></div>
            </div>
          </div>`;

        const sidebar = document.getElementById('adminSidebar');
        const overlay = document.getElementById('adminSidebarOverlay');
        const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('open'); };
        document.getElementById('adminHamburgerBtn').addEventListener('click', () => {
          sidebar.classList.toggle('open');
          overlay.classList.toggle('open');
        });
        overlay.addEventListener('click', closeSidebar);

        document.querySelectorAll('[data-page]').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-page]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentPage = btn.dataset.page;
            document.getElementById('adminPageTitle').textContent = btn.textContent.trim();
            this.loadPage();
            closeSidebar();
          });
        });

        this.loadPage();
      },

      async loadPage() {
        const c = document.getElementById('adminContent');
        c.innerHTML = '<div style="text-align:center;padding:40px;"><div class="brand-loader"><div class="brand-loader-ring"></div><img src="/assets/images/MetaLink-NFT-icon.png" alt="" class="brand-loader-logo"></div></div>';

        if (this.currentPage === 'dashboard') await this.loadDashboard(c);
        else if (this.currentPage === 'users') await this.loadUsers(c);
        else if (this.currentPage === 'multiaccounts') await this.loadMultiAccounts(c);
        else if (this.currentPage === 'withdrawals') await this.loadWithdrawals(c);
        else if (this.currentPage === 'deposits') await this.loadDeposits(c);
        else if (this.currentPage === 'reservations') await this.loadReservations(c);
        else if (this.currentPage === 'wallets') await this.loadWallets(c);
        else if (this.currentPage === 'announcements') await this.loadAnnouncements(c);
        else if (this.currentPage === 'settings') await this.loadSettings(c);
      },

      async loadDashboard(c) {
        try {
          const stats = await this.api('/admin/stats');
          c.innerHTML = `
            <div class="admin-stats">
              <div class="admin-stat-card"><div class="label">Total Users</div><div class="value">${stats.totalUsers}</div></div>
              <div class="admin-stat-card"><div class="label">Total Deposits</div><div class="value">$${stats.totalDeposits.toFixed(2)}</div></div>
              <div class="admin-stat-card"><div class="label">Total Withdrawals</div><div class="value">$${stats.totalWithdrawals.toFixed(2)}</div></div>
              <div class="admin-stat-card"><div class="label">Pending Withdrawals</div><div class="value" style="color:${stats.pendingWithdrawals > 0 ? '#ef4444' : '#22c55e'}">${stats.pendingWithdrawals}</div></div>
              <div class="admin-stat-card"><div class="label">Active Stakes</div><div class="value">${stats.activeStakes}</div></div>
              <div class="admin-stat-card"><div class="label">Total Stake Value</div><div class="value">$${stats.totalStakeValue.toFixed(2)}</div></div>
            </div>`;
        } catch (e) { c.innerHTML = '<p>Failed to load dashboard</p>'; }
      },

      async loadUsers(c) {
        try {
          this.usersCache = await this.api('/admin/users');
          this.userSort = this.userSort || 'newest';
          this.userJoined = this.userJoined || 'all';
          const DAY = 86400000, now = Date.now();
          const count = ms => this.usersCache.filter(u => now - new Date(u.createdAt).getTime() < ms).length;
          const chip = (key, label, n) => `<button class="admin-btn" data-joined="${key}" style="${this.userJoined === key ? 'background:#4f46e5;color:#fff;' : 'background:#eef2ff;color:#4f46e5;'}" onclick="Admin.setUserJoined('${key}')">${label}${n !== undefined ? ` (${n})` : ''}</button>`;
          c.innerHTML = `
            <div class="admin-table-card">
              <div class="admin-table-header" style="flex-wrap:wrap;gap:12px;">
                <h3 id="usersCountTitle">All Users (${this.usersCache.length})</h3>
                <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
                  <input class="admin-form-input" style="width:220px;" placeholder="Search name, email or UID" value="${escapeHtml(this.userQuery || '')}" oninput="Admin.userQuery=this.value;Admin.renderUserRows()">
                  <select class="admin-form-input" style="width:auto;" onchange="Admin.userSort=this.value;Admin.renderUserRows()">
                    <option value="newest" ${this.userSort === 'newest' ? 'selected' : ''}>Newest users first</option>
                    <option value="oldest" ${this.userSort === 'oldest' ? 'selected' : ''}>Oldest users first</option>
                    <option value="active" ${this.userSort === 'active' ? 'selected' : ''}>Recently active</option>
                    <option value="balance" ${this.userSort === 'balance' ? 'selected' : ''}>Highest balance</option>
                  </select>
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px;padding:12px 24px 0;" id="userJoinedChips">
                ${chip('all', 'All')}${chip('today', 'Joined today', count(DAY))}${chip('week', 'This week', count(7 * DAY))}${chip('month', 'This month', count(30 * DAY))}${chip('older', 'Older than 30 days', this.usersCache.length - count(30 * DAY))}
              </div>
              <div style="overflow-x:auto;">
                <table class="admin-table">
                  <thead><tr><th>Status</th><th>Last Seen</th><th>User</th><th>UID</th><th>Location</th><th>Balance</th><th>Level</th><th>Shared IP</th><th>Last IP</th><th>Joined</th><th>Actions</th></tr></thead>
                  <tbody id="userRows"></tbody>
                </table>
              </div>
            </div>`;
          this.renderUserRows();
        } catch (e) { c.innerHTML = '<p>Failed to load users</p>'; }
      },

      setUserJoined(key) {
        this.userJoined = key;
        document.querySelectorAll('#userJoinedChips [data-joined]').forEach(b => {
          const on = b.dataset.joined === key;
          b.style.background = on ? '#4f46e5' : '#eef2ff';
          b.style.color = on ? '#fff' : '#4f46e5';
        });
        this.renderUserRows();
      },

      renderUserRows() {
        const DAY = 86400000, now = Date.now();
        const age = u => now - new Date(u.createdAt).getTime();
        const lastSeen = u => Math.max(0, ...[u.lastActiveAt, u.lastLoginAt].filter(Boolean).map(t => new Date(t).getTime()));
        const joinedOk = {
          all: () => true, today: u => age(u) < DAY, week: u => age(u) < 7 * DAY,
          month: u => age(u) < 30 * DAY, older: u => age(u) >= 30 * DAY
        }[this.userJoined || 'all'];
        const q = (this.userQuery || '').trim().toLowerCase();
        const sorters = {
          newest: (a, b) => new Date(b.createdAt) - new Date(a.createdAt),
          oldest: (a, b) => new Date(a.createdAt) - new Date(b.createdAt),
          active: (a, b) => lastSeen(b) - lastSeen(a),
          balance: (a, b) => (b.walletBalance || 0) - (a.walletBalance || 0)
        };
        const users = (this.usersCache || [])
          .filter(joinedOk)
          .filter(u => !q || [u.username, u.email, u.uid].some(v => (v || '').toLowerCase().includes(q)))
          .sort(sorters[this.userSort || 'newest']);
        document.getElementById('usersCountTitle').textContent = users.length === this.usersCache.length
          ? `All Users (${users.length})` : `Users (${users.length} of ${this.usersCache.length})`;
        document.getElementById('userRows').innerHTML = users.map(u => `
                      <tr>
                        <td>${this.statusBadge(u)}</td>
                        <td style="white-space:nowrap;font-size:0.82rem;">${this.lastSeenCell(u)}</td>
                        <td>${this.userCell(u)}</td>
                        <td><strong>${escapeHtml(u.uid)}</strong></td>
                        <td style="font-size:0.85rem;">${this.locationHtml(u.location)}</td>
                        <td><strong>${u.walletBalance.toFixed(2)}</strong></td>
                        <td>${u.level}</td>
                        <td>${u.sharedIpAccounts ? `<button class="admin-btn admin-btn-reject" title="Other accounts have used this user's IP address" onclick="Admin.showUserIps('${escapeHtml(u.id)}')">&#9888; ${u.sharedIpAccounts} other${u.sharedIpAccounts > 1 ? 's' : ''}</button>` : '<span style="color:#ccc;">-</span>'}</td>
                        <td style="font-size:0.78rem;">${escapeHtml(u.lastIp || u.signupIp) || '-'}</td>
                        <td style="white-space:nowrap;font-size:0.82rem;">${new Date(u.createdAt).toLocaleDateString()}${age(u) < DAY ? ' <span class="admin-badge admin-badge-approved" style="font-size:0.65rem;">NEW</span>' : ''}<br><span style="color:#999;font-size:0.72rem;">${new Date(u.createdAt).toLocaleTimeString()}</span></td>
                        <td style="white-space:nowrap;">
                          <button class="admin-btn admin-btn-edit" onclick="Admin.editUser('${escapeHtml(u.id)}')">Edit</button>
                          <button class="admin-btn admin-btn-approve" onclick="Admin.addBalance('${escapeHtml(u.id)}','${escapeHtml(u.username)}')">+ Balance</button>
                          ${this.moderationButtons(u)}
                        </td>
                      </tr>`).join('') || '<tr><td colspan="11" style="text-align:center;color:#888;padding:24px;">No users match.</td></tr>';
      },

      // Profile picture (or the first letter of the username); click to see it full size.
      avatarHtml(u, size = 36) {
        const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;object-fit:cover;`;
        if (u.avatar) {
          return `<img src="${escapeHtml(u.avatar)}" alt="" style="${style}cursor:zoom-in;border:1px solid #e5e7eb;" onclick="Admin.showAvatar(this.src, '${escapeHtml(u.username)}')">`;
        }
        return `<span style="${style}display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#7C3AED,#14B8A6);color:#fff;font-weight:700;font-size:${Math.round(size * 0.42)}px;">${escapeHtml((u.username || '?').charAt(0).toUpperCase())}</span>`;
      },

      userCell(u) {
        return `<div style="display:flex;align-items:center;gap:10px;">${this.avatarHtml(u)}<div style="min-width:0;"><strong>${escapeHtml(u.username)}</strong>${u.email ? `<br><span style="font-size:0.75rem;color:#888;">${escapeHtml(u.email)}</span>` : ''}</div></div>`;
      },

      showAvatar(src, username) {
        const modal = document.createElement('div');
        modal.className = 'admin-modal-overlay';
        modal.innerHTML = `<div class="admin-modal" style="max-width:420px;text-align:center;">
          <h3>${escapeHtml(username)}</h3>
          <img src="${escapeHtml(src)}" alt="Profile picture" style="width:100%;max-width:360px;border-radius:16px;margin:8px 0 14px;">
          <button class="admin-btn" style="width:100%;background:#eee;" onclick="this.closest('.admin-modal-overlay').remove()">Close</button></div>`;
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);
      },

      // Country flag + name. Flag images rather than flag emoji, which Windows shows as plain letters;
      // if the image can't load, the 2-letter code shows instead.
      locationHtml(loc) {
        if (!loc || !/^[A-Z]{2}$/i.test(loc.country || '')) return '<span style="color:#aaa;">Unknown</span>';
        const code = loc.country.toLowerCase();
        return `<span style="white-space:nowrap;display:inline-flex;align-items:center;gap:6px;" title="${escapeHtml(loc.countryName)}">
          <img src="https://flagcdn.com/w40/${code}.png" alt="${escapeHtml(loc.country)}" width="20" height="15" style="border-radius:2px;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,0.08);" onerror="this.replaceWith(document.createTextNode('${escapeHtml(loc.country)}'))">
          ${escapeHtml(loc.countryName)}</span>`;
      },

      // Most recent sign of life: app activity (recorded about once a minute) or a login.
      lastSeenCell(u) {
        const times = [u.lastActiveAt, u.lastLoginAt].filter(Boolean).map(t => new Date(t).getTime());
        if (!times.length) return '<span style="color:#aaa;">Never</span>';
        const t = Math.max(...times);
        const mins = Math.floor((Date.now() - t) / 60000);
        const full = new Date(t).toLocaleString();
        if (mins < 5) return `<span style="color:#16a34a;font-weight:700;" title="${full}">&#9679; Online now</span>`;
        if (mins >= 43200) return `<span title="${full}">${full}</span>`; // over 30 days: just the date
        const ago = mins < 60 ? `${mins} min ago`
          : mins < 1440 ? `${Math.floor(mins / 60)} hr${Math.floor(mins / 60) > 1 ? 's' : ''} ago`
          : `${Math.floor(mins / 1440)} day${Math.floor(mins / 1440) > 1 ? 's' : ''} ago`;
        return `<span title="${full}">${ago}</span><br><span style="font-size:0.72rem;color:#999;">${full}</span>`;
      },

      statusBadge(u) {
        if (u.bannedAt) return `<span class="admin-badge admin-badge-rejected" title="${escapeHtml(u.banReason || 'No reason given')}">&#9940; Banned</span>`;
        if (u.frozenUntil && new Date(u.frozenUntil).getTime() > Date.now()) {
          return `<span class="admin-badge admin-badge-pending" style="background:#ffedd5;color:#c2410c;" title="Until ${new Date(u.frozenUntil).toLocaleString()}${u.suspendReason ? ' — ' + escapeHtml(u.suspendReason) : ''}">&#9208; Suspended</span>`;
        }
        if (u.online === undefined) return '<span class="admin-badge admin-badge-approved">Active</span>';
        return `<span class="admin-badge ${u.online ? 'admin-badge-approved' : 'admin-badge-pending'}">${u.online ? '&#9679; Online' : '&#9675; Offline'}</span>`;
      },

      moderationButtons(u) {
        const id = escapeHtml(u.id), name = escapeHtml(u.username);
        const suspended = u.frozenUntil && new Date(u.frozenUntil).getTime() > Date.now();
        return `
          ${suspended
            ? `<button class="admin-btn admin-btn-edit" onclick="Admin.moderate('unsuspend','${id}','${name}')">Unsuspend</button>`
            : `<button class="admin-btn admin-btn-edit" style="background:#ffedd5;color:#c2410c;" onclick="Admin.showSuspendForm('${id}','${name}')">Suspend</button>`}
          ${u.bannedAt
            ? `<button class="admin-btn admin-btn-approve" onclick="Admin.moderate('unban','${id}','${name}')">Unban</button>`
            : `<button class="admin-btn admin-btn-delete" onclick="Admin.showBanForm('${id}','${name}')">Ban</button>`}
          <button class="admin-btn" style="background:#eef2ff;color:#4f46e5;" onclick="Admin.showUserIps('${id}')">IPs</button>`;
      },

      showSuspendForm(id, username) {
        const durations = [['1 hour', 1], ['24 hours', 24], ['3 days', 72], ['7 days', 168], ['30 days', 720]];
        const modal = document.createElement('div');
        modal.className = 'admin-modal-overlay';
        modal.innerHTML = `
          <div class="admin-modal">
            <h3>Suspend ${username}</h3>
            <p style="font-size:0.85rem;color:#888;margin-bottom:14px;">The user is logged out immediately and can't sign in until the suspension ends. They'll see the end date and reason when they try.</p>
            <div class="admin-form-group">
              <label class="admin-form-label">Duration</label>
              <div style="display:flex;flex-wrap:wrap;gap:8px;" id="suspendPresets">
                ${durations.map(([label, h], i) => `<button type="button" class="admin-btn ${i === 1 ? 'admin-btn-primary' : ''}" style="${i === 1 ? '' : 'background:#eee;'}" data-hours="${h}">${label}</button>`).join('')}
                <button type="button" class="admin-btn" style="background:#eee;" data-hours="custom">Custom</button>
              </div>
            </div>
            <div class="admin-form-group" id="suspendCustomWrap" style="display:none;">
              <label class="admin-form-label">Suspend until</label>
              <input class="admin-form-input" id="suspendUntil" type="datetime-local">
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">Reason (shown to the user)</label>
              <textarea class="admin-form-input admin-form-textarea" id="suspendReason" maxlength="300" placeholder="e.g. Multiple accounts on one device"></textarea>
            </div>
            <div style="display:flex;gap:10px;">
              <button class="admin-btn" style="flex:1;background:#eee;" onclick="this.closest('.admin-modal-overlay').remove()">Cancel</button>
              <button class="admin-btn admin-btn-primary" style="flex:1;" id="suspendConfirm">Suspend</button>
            </div>
          </div>`;
        document.body.appendChild(modal);
        let hours = 24;
        modal.querySelectorAll('#suspendPresets button').forEach(btn => btn.addEventListener('click', () => {
          modal.querySelectorAll('#suspendPresets button').forEach(b => { b.classList.remove('admin-btn-primary'); b.style.background = '#eee'; });
          btn.classList.add('admin-btn-primary'); btn.style.background = '';
          hours = btn.dataset.hours;
          modal.querySelector('#suspendCustomWrap').style.display = hours === 'custom' ? '' : 'none';
        }));
        modal.querySelector('#suspendConfirm').addEventListener('click', async () => {
          let until;
          if (hours === 'custom') {
            const v = modal.querySelector('#suspendUntil').value;
            if (!v) { this.toast('Pick an end date and time'); return; }
            until = new Date(v).toISOString();
          } else until = new Date(Date.now() + Number(hours) * 3600000).toISOString();
          try {
            await this.api(`/admin/users/${id}/suspend`, { method: 'POST', body: JSON.stringify({ until, reason: modal.querySelector('#suspendReason').value }) });
            modal.remove();
            this.toast(`${username} suspended until ${new Date(until).toLocaleString()}`, 'success');
            this.refreshAfterModeration();
          } catch (e) { this.toast(e.message); }
        });
      },

      showBanForm(id, username) {
        const modal = document.createElement('div');
        modal.className = 'admin-modal-overlay';
        modal.innerHTML = `
          <div class="admin-modal">
            <h3 style="color:#dc2626;">Ban ${username}</h3>
            <p style="font-size:0.85rem;color:#888;margin-bottom:14px;">The account is permanently blocked and logged out immediately. You can unban it later. Their balance and history are kept.</p>
            <div class="admin-form-group">
              <label class="admin-form-label">Reason (shown to the user)</label>
              <textarea class="admin-form-input admin-form-textarea" id="banReason" maxlength="300" placeholder="e.g. Fraudulent deposits"></textarea>

              <input type="checkbox" id="banBlockIps" style="width:18px;height:18px;margin-top:2px;">
              <span style="font-size:0.85rem;"><strong>Also block new sign-ups from this user's IP addresses.</strong><br>
              <span style="color:#888;">Careful: mobile networks and public Wi-Fi share IPs between many people, so this can block innocent new users too.</span></span>

          try {
            const r = await this.api(`/admin/users/${id}/ban`, { method: 'POST', body: JSON.stringify({ reason: modal.querySelector('#banReason').value, blockIps: modal.querySelector('#banBlockIps').checked }) });
            modal.remove();
            this.toast(`${username} banned${r.blockedIps ? ` and ${r.blockedIps} IP address${r.blockedIps > 1 ? 'es' : ''} blocked` : ''}`, 'success');
            this.refreshAfterModeration();
          } catch (e) { this.toast(e.message); }
        });
      },

      async moderate(action, id, username) {
        const labels = { unsuspend: 'Lift the suspension for', unban: 'Unban' };
        if (!confirm(`${labels[action]} ${username}?`)) return;
        try {
          await this.api(`/admin/users/${id}/${action}`, { method: 'POST' });
          this.toast(action === 'unban' ? `${username} unbanned` : `Suspension lifted for ${username}`, 'success');
          this.refreshAfterModeration();
        } catch (e) { this.toast(e.message); }
      },

      refreshAfterModeration() {
        document.querySelectorAll('.admin-modal-overlay').forEach(m => m.remove());
        this.loadPage();
      },

      async showUserIps(id) {

          modal.querySelector('.admin-modal').innerHTML = `

                <td style="font-size:0.82rem;">${this.locationHtml(i.location)}</td>
                <td style="font-size:0.8rem;">${new Date(i.firstSeen).toLocaleString()}</td>
                <td style="font-size:0.8rem;">${new Date(i.lastSeen).toLocaleString()}</td>
                <td>${i.otherAccounts ? `<button class="admin-btn admin-btn-reject" onclick="Admin.openMultiAccounts('${escapeHtml(i.ip)}')">&#9888; ${i.otherAccounts}</button>` : '0'}</td>
              </tr>`).join('')}</tbody></table></div>` : '<p style="color:#888;padding:12px 0;">No IP addresses recorded yet. They are recorded from now on whenever this user signs up, logs in or uses the app.</p>'}
            <button class="admin-btn" style="width:100%;background:#eee;margin-top:12px;" onclick="this.closest('.admin-modal-overlay').remove()">Close</button>`;
        } catch (e) { modal.querySelector('.admin-modal').innerHTML = `<p style="padding:20px;">${escapeHtml(e.message)}</p>`; }

      openMultiAccounts(ip) {
        document.querySelectorAll('.admin-modal-overlay').forEach(m => m.remove());
        this.multiAccountFilter = ip || '';
        document.querySelector('[data-page="multiaccounts"]').click();
      },

      async loadMultiAccounts(c) {
        try {

              Check that this matches <a href="https://whatismyipaddress.com" target="_blank" rel="noopener">whatismyipaddress.com</a> &mdash; if it doesn't, IP detection is seeing the hosting network instead of visitors, so let your developer know.
              <br><span style="color:#888;">Accounts sharing an IP aren't always the same person: families, offices, mobile networks and public Wi-Fi share IPs. Check deposits, referrals and timing before banning.</span>

              <div class="admin-table-header" style="flex-wrap:wrap;gap:10px;">
                <h3>Multiple Accounts on One IP (${groups.length})</h3>

                <tbody>${bannedIps.map(b => `<tr>
                  <td style="font-family:monospace;">${escapeHtml(b.ip)}</td>
                  <td>${escapeHtml(b.username || '-')}</td>
                  <td style="max-width:220px;">${escapeHtml(b.reason || '-')}</td>

                  <td><button class="admin-btn admin-btn-approve" onclick="Admin.unblockIp('${escapeHtml(b.ip)}')">Unblock</button></td>
                </tr>`).join('')}</tbody></table></div>` : '<p style="padding:20px;color:#888;text-align:center;">No IP addresses are blocked. You can block a banned user\'s IPs when banning them.</p>'}
            </div>`;
          this.renderMultiAccountGroups();
        } catch (e) { c.innerHTML = '<p>Failed to load</p>'; }
      },

      renderMultiAccountGroups() {
        const el = document.getElementById('multiGroups');
        if (!el) return;
        const q = (this.multiAccountFilter || '').trim().toLowerCase();
        const groups = (this.multiAccountGroups || []).filter(g => !q || g.ip.toLowerCase().includes(q) ||
          g.accounts.some(a => (a.username || '').toLowerCase().includes(q) || (a.email || '').toLowerCase().includes(q) || (a.uid || '').toLowerCase().includes(q)));
        if (!groups.length) {
          el.innerHTML = `<p style="padding:24px;color:#888;text-align:center;">${q ? 'No matches.' : 'No IP address is shared by more than one account yet. IPs are recorded whenever users sign up, log in or use the app.'}</p>`;
          return;
        }
        el.innerHTML = groups.map(g => `
          <div style="border:1px solid #eee;border-radius:10px;margin-bottom:16px;overflow:hidden;">
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:#fafafa;border-bottom:1px solid #eee;">
              <strong style="font-family:monospace;font-size:0.95rem;">${escapeHtml(g.ip)}</strong>
              <span style="font-size:0.85rem;">${this.locationHtml(g.location)}</span>
              <span class="admin-badge admin-badge-rejected">${g.accounts.length} accounts</span>
              ${g.ipBanned ? '<span class="admin-badge admin-badge-rejected">Sign-ups blocked</span>' : ''}
              <span style="margin-left:auto;font-size:0.78rem;color:#888;">Last activity ${new Date(g.lastSeen).toLocaleString()}</span>
            </div>
            <div style="overflow-x:auto;"><table class="admin-table">
              <thead><tr><th>Status</th><th>Last Seen</th><th>User</th><th>UID</th><th>Balance</th><th>Joined</th><th>First seen on this IP</th><th>Actions</th></tr></thead>
              <tbody>${g.accounts.map(a => `<tr>
                <td>${this.statusBadge(a)}</td>
                <td style="white-space:nowrap;font-size:0.82rem;">${this.lastSeenCell(a)}</td>
                <td>${this.userCell(a)}</td>
                <td>${escapeHtml(a.uid)}</td>
                <td>${Number(a.walletBalance || 0).toFixed(2)}</td>
                <td style="font-size:0.8rem;">${new Date(a.createdAt).toLocaleDateString()}</td>
                <td style="font-size:0.8rem;">${new Date(a.firstSeenOnIp).toLocaleString()}</td>
                <td style="white-space:nowrap;">${this.moderationButtons(a)}</td>

            </table></div>

      async unblockIp(ip) {
        if (!confirm(`Allow new sign-ups from ${ip} again?`)) return;
        try {
          await this.api('/admin/banned-ips/' + encodeURIComponent(ip), { method: 'DELETE' });
          this.toast('IP unblocked', 'success');
          this.loadPage();

      async editUser(id) {
        try {
          const users = await this.api('/admin/users');

          if (!user) return;

          const modal = document.createElement('div');

            <div class="admin-modal">
              <h3>Edit User: ${escapeHtml(user.username)}</h3>
              <div class="admin-form-group"><label class="admin-form-label">Username</label><input class="admin-form-input" id="editUsername" value="${escapeHtml(user.username)}"></div>

              <div class="admin-form-group" style="border-top:1px solid #eee;padding-top:14px;">
                <label class="admin-form-label">Freeze Account Until</label>

                <p style="font-size:0.75rem;color:#888;margin-top:4px;">${user.frozenUntil && new Date(user.frozenUntil).getTime() > Date.now() ? `Currently frozen until ${new Date(user.frozenUntil).toLocaleString()}.` : 'Not currently frozen.'} Leave blank and save to unfreeze.</p>

              <div style="display:flex;gap:10px;">

              </div>
            </div>`;
          document.body.appendChild(modal);
        } catch (e) { this.toast(e.message); }
      },

      async saveUser(id) {
        try {
          const frozenInput = document.getElementById('editFrozenUntil').value;
          const data = {
            username: document.getElementById('editUsername').value,
            walletBalance: parseFloat(document.getElementById('editBalance').value),
            level: parseInt(document.getElementById('editLevel').value),
            points: parseFloat(document.getElementById('editPoints').value),
            frozenUntil: frozenInput ? new Date(frozenInput).toISOString() : null
          };
          await this.api(`/admin/users/${id}`, { method: 'PUT', body: JSON.stringify(data) });

          const trc20 = document.getElementById('editTrc20').value;
          const bep20 = document.getElementById('editBep20').value;
          await this.api(`/admin/users/${id}/wallet`, { method: 'PUT', body: JSON.stringify({ trc20, erc20: bep20 }) });

          document.querySelector('.admin-modal-overlay')?.remove();
          this.toast('User updated!', 'success');
          this.loadPage();
        } catch (e) { this.toast(e.message); }
      },

        modal.className = 'admin-modal-overlay';
        modal.innerHTML = `

            <h3>Add Balance: ${escapeHtml(username)}</h3>
            <div class="admin-form-group"><label class="admin-form-label">Amount (USDT)</label><input class="admin-form-input" id="addBalanceAmount" type="number" placeholder="Enter amount"></div>

        const modal = document.createElement('div');
        modal.className = 'admin-modal-overlay';
        modal.innerHTML = `
          <div class="admin-modal" style="max-width:640px;">
            <h3>Payment Screenshot</h3>
            <div id="proofBody" style="text-align:center;padding:20px;color:#888;">Loading...</div>

      addReserveLevel() {
        const last = this.reserveLevels[this.reserveLevels.length - 1];

        this.reserveLevels.push({ name: 'New Item', min, max: min * 2, rewardPct: 5, image: '' });
        this.renderReservations();

      removeReserveLevel(i) {
        if (!confirm('Remove this level?')) return;
        this.reserveLevels.splice(i, 1);
        this.renderReservations();

        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          try {
            const res = await this.api('/admin/upload', { method: 'POST', body: JSON.stringify({ image: e.target.result }) });
            this.reserveLevels[i].image = res.url;
            this.renderReservations();
          } catch (err) { this.toast('Failed to upload image'); }
        };
        reader.readAsDataURL(file);
      },

          this.toast('Reservation levels saved!', 'success');

      previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
          const preview = document.getElementById('annImagePreview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          try {
            const res = await this.api('/admin/upload', {
              method: 'POST',
              body: JSON.stringify({ image: e.target.result, filename: file.name.split('.')[0] })
            });
            document.getElementById('annImageUrl').value = res.url;
          } catch (err) { this.toast('Failed to upload image'); }
        };
        reader.readAsDataURL(file);
      },

      async saveAnnouncement(id) {
        const data = {
          title: document.getElementById('annTitle').value,
          date: document.getElementById('annDate').value,
          category: document.getElementById('annCategory').value,
          content: document.getElementById('annContent').value,
          image: document.getElementById('annImageUrl').value,
        };
        if (!data.title || !data.content) { this.toast('Title and content are required'); return; }
        try {
          if (id) {
            await this.api(`/admin/announcements/${id}`, { method: 'PUT', body: JSON.stringify(data) });
          } else {
            await this.api('/admin/announcements', { method: 'POST', body: JSON.stringify(data) });
          }
          document.querySelector('.admin-modal-overlay')?.remove();
          this.toast(`Announcement ${id ? 'updated' : 'created'}!`, 'success');
          this.loadPage();
        } catch (e) { this.toast(e.message); }
      },

      async editAnnouncement(id) {
        try {
          const announcements = await this.api('/admin/announcements');
          const ann = announcements.find(a => a.id === id);
          if (ann) this.showAnnouncementForm(ann);
        } catch (e) { this.toast(e.message); }
      },

        if (!confirm('Delete this announcement?')) return;
        try {

          this.toast('Deleted!', 'success');
          this.loadPage();
        } catch (e) { this.toast(e.message); }

          ? `<div style="display:flex;align-items:center;gap:6px;white-space:nowrap;"><span style="font-family:monospace;font-size:0.8rem;" title="${escapeHtml(a)}">${escapeHtml(a.length > 18 ? a.slice(0, 8) + '…' + a.slice(-6) : a)}</span>

          : '<span style="color:#ccc;">Not set</span>';

            <td style="font-size:0.82rem;">${this.locationHtml(w.location)}</td>

                  <label class="admin-form-label">Current Password</label>
                  <input class="admin-form-input" id="cfgCurrentPassword" type="password" placeholder="Enter current password">
                </div>
                <div class="admin-form-group">
                  <label class="admin-form-label">New Password</label>
                  <input class="admin-form-input" id="cfgNewPassword" type="password" placeholder="Min 6 characters">
                </div>
                <div class="admin-form-group">
                  <label class="admin-form-label">Confirm New Password</label>
                  <input class="admin-form-input" id="cfgConfirmNewPassword" type="password" placeholder="Re-enter new password">
                </div>
                <button class="admin-btn admin-btn-primary" style="padding:12px 32px;font-size:0.95rem;" onclick="Admin.changeAdminPassword()">Update Password</button>
              </div>
            </div>`;
        } catch (e) { c.innerHTML = '<p>Failed to load settings</p>'; }
      },

      async changeAdminPassword() {
        const currentPassword = document.getElementById('cfgCurrentPassword').value;
        const newPassword = document.getElementById('cfgNewPassword').value;
        const confirmPassword = document.getElementById('cfgConfirmNewPassword').value;
        if (!currentPassword || !newPassword || !confirmPassword) { this.toast('Fill in all fields'); return; }
        if (newPassword !== confirmPassword) { this.toast('New passwords do not match'); return; }
        try {
          await this.api('/admin/change-password', {
            method: 'POST',
            body: JSON.stringify({ currentPassword, newPassword, confirmPassword })
          });
          document.getElementById('cfgCurrentPassword').value = '';
          document.getElementById('cfgNewPassword').value = '';
          document.getElementById('cfgConfirmNewPassword').value = '';
          this.toast('Admin password changed!', 'success');
        } catch (e) { this.toast(e.message); }
      },

      async saveAddresses() {
        try {
          await this.api('/admin/platform-config', {
            method: 'PUT',
            body: JSON.stringify({
              depositAddressTrc20: document.getElementById('cfgTrc20').value,
              depositAddressBep20: document.getElementById('cfgBep20').value
            })
          });
          this.toast('Deposit addresses saved!', 'success');
        } catch (e) { this.toast(e.message); }
      },

      async saveCommunityLinks() {
        try {
          const cfg = await this.api('/admin/platform-config', {
            method: 'PUT',
            body: JSON.stringify({
              telegramLink: document.getElementById('cfgTelegramLink').value,
              groupLink: document.getElementById('cfgGroupLink').value
            })
          });
          document.getElementById('cfgTelegramLink').value = cfg.telegramLink || '';
          document.getElementById('cfgGroupLink').value = cfg.groupLink || '';
          this.toast('Community links saved!', 'success');
        } catch (e) { this.toast(e.message); }
      },

      async savePlatformSettings() {
        try {
          await this.api('/admin/platform-config', {
            method: 'PUT',
            body: JSON.stringify({
              signupBonus: document.getElementById('cfgSignupBonus').value,
              minDeposit: document.getElementById('cfgMinDeposit').value,
              referralBonusPct: document.getElementById('cfgReferralPct').value,
              referralBonusPctB: document.getElementById('cfgReferralPctB').value,
              referralBonusPctC: document.getElementById('cfgReferralPctC').value,
              withdrawalFeePct: document.getElementById('cfgWithdrawalFee').value,
              minWithdrawal: document.getElementById('cfgMinWithdrawal').value,
              reserveWinRatePct: document.getElementById('cfgReserveWinRate').value,
              dailyCheckinReward: document.getElementById('cfgDailyCheckin').value,
              handlingFeeEnabled: document.getElementById('cfgHandlingFeeEnabled').checked,
              depositScreenshotEnabled: document.getElementById('cfgDepositScreenshot').checked,
              depositTxidEnabled: document.getElementById('cfgDepositTxid').checked
            })
          });
          this.toast('Platform settings saved!', 'success');
        } catch (e) { this.toast(e.message); }
      },

      async saveLevelThresholds() {
        try {
          const body = {};
          for (let lv = 1; lv <= 6; lv++) body['levelThreshold' + lv] = document.getElementById('cfgLevelThreshold' + lv).value;
          await this.api('/admin/platform-config', { method: 'PUT', body: JSON.stringify(body) });
          this.toast('Level thresholds saved!', 'success');
        } catch (e) { this.toast(e.message); }
      },

      logout() {
        if (this.token) {
          fetch('/api/admin/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + this.token } }).catch(() => {});
        }
        this.token = null;
        localStorage.removeItem('mlk_admin_token');
        this.renderLogin();
      }
    };

    Admin.init();
  </script>
</body>
</html>
